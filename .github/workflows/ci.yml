name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: falta-gente-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter api db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --maxWorkers=1
      - run: pnpm test:ci
      - run: pnpm build

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: falta_gente_test
          POSTGRES_PASSWORD: falta-gente-ci-only
          POSTGRES_DB: falta_gente_test
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U falta_gente_test -d falta_gente_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://falta_gente_test:falta-gente-ci-only@127.0.0.1:55432/falta_gente_test?schema=public
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter api db:generate
      - run: pnpm --filter api db:migrate
      - run: pnpm test:integration --maxWorkers=1 --no-file-parallelism

  browser:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: falta_gente_test
          POSTGRES_PASSWORD: falta-gente-ci-only
          POSTGRES_DB: falta_gente_test
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U falta_gente_test -d falta_gente_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://falta_gente_test:falta-gente-ci-only@127.0.0.1:55432/falta_gente_test?schema=public
      E2E_WEB_URL: http://localhost:3000
      E2E_API_URL: http://localhost:3001/api/v1
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      JWT_SECRET: test-only-jwt-secret-longer-than-32-characters
      CSRF_SECRET: test-only-csrf-secret-longer-than-32-characters
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter api db:generate
      - run: pnpm --filter api db:migrate
      - run: pnpm --filter api db:seed:dev
        env:
          NODE_ENV: development
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: falta-gente-browser-results
          path: test-results/ci-*.xml
          if-no-files-found: ignore
          retention-days: 7

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build final image
        run: >-
          docker build --file apps/${{ matrix.app }}/Dockerfile
          --tag falta-gente-${{ matrix.app }}:ci
          --build-arg NEXT_PUBLIC_API_URL=http://localhost:3001/api/v1 .

  ci-required:
    if: ${{ always() }}
    needs: [quality, integration, browser, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module - <<'NODE'
          const jobs = JSON.parse(process.env.JOB_RESULTS);
          const required = ['quality', 'integration', 'browser', 'docker'];
          for (const job of required) {
            const result = jobs[job]?.result;
            console.log(`${job}: ${result ?? 'missing'}`);
            if (result !== 'success') process.exitCode = 1;
          }
          NODE
